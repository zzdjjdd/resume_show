<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 模拟面试 · Resume Agent</title>
    <link rel="stylesheet" href="static/css/style.css?v=5" />
    <link rel="stylesheet" href="static/css/ai-create.css?v=5" />
    <link rel="stylesheet" href="static/css/interview.css?v=5" />
    <link rel="stylesheet" href="static/css/neon.css?v=5" />
    <link rel="stylesheet" href="static/css/comic.css?v=5" />
    <script src="static/js/theme.js?v=5"></script>
  </head>
  <body class="aic-body">
    <!-- 顶栏 -->
    <header class="aic-topbar">
      <div class="aic-tb-left">
        <a class="aic-back" href="/" title="返回首页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <span class="aic-logo iv-logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </span>
        <span class="aic-title">AI 模拟面试</span>
        <span class="aic-badge">基于简历</span>
      </div>
      <div class="aic-tb-right">
        <button id="theme-toggle" class="aic-link" type="button" title="切换视觉风格：深色 HUD ⇄ 奶白 CREAM ⇄ 漫画 COMIC">◐ <span data-theme-label>HUD</span></button>
        <span class="hud-clock" data-hud-clock title="舰桥时间">--:--:--</span>
        <button id="btn-settings" class="aic-link" type="button">⚙️ 大模型设置</button>
        <a class="aic-link" href="/jobs">岗位雷达</a>
        <a class="aic-link" href="/studio">进入编辑器</a>
      </div>
    </header>

    <div class="iv-main">
      <!-- 左：面试设置 -->
      <aside class="iv-side">
        <div class="iv-card">
          <div class="iv-card-title">面试设置</div>
          <div class="iv-src-row">
            <button class="iv-src-chip active" data-src="file" type="button">📁 简历档案</button>
            <button class="iv-src-chip" data-src="pdf" type="button">📄 导入 PDF</button>
          </div>
          <label class="iv-label" id="iv-file-label">简历档案
            <select id="iv-file" class="iv-input"></select>
          </label>
          <div id="iv-pdf-zone" class="iv-pdf-zone hidden">
            <button id="btn-pdf-pick" class="iv-btn-upload" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
              选择简历 PDF
            </button>
            <input id="iv-pdf-input" type="file" accept="application/pdf,.pdf" hidden />
            <div id="iv-pdf-card" class="iv-pdf-card hidden">
              <div class="iv-pdf-line">
                <span class="iv-pdf-name" id="iv-pdf-name"></span>
                <span class="iv-pdf-badge" id="iv-pdf-badge"></span>
              </div>
              <div class="iv-pdf-excerpt" id="iv-pdf-excerpt"></div>
              <button id="btn-pdf-del" class="iv-pdf-del" type="button">移除</button>
            </div>
          </div>
          <label class="iv-label">目标公司
            <input id="iv-company" class="iv-input" placeholder="如：字节跳动" />
          </label>
          <label class="iv-label">目标岗位
            <input id="iv-position" class="iv-input" placeholder="如：前端工程师" />
          </label>
          <label class="iv-label">岗位 JD（可选）
            <textarea id="iv-jd" class="iv-input" rows="4" placeholder="粘贴 JD，让提问更有针对性"></textarea>
          </label>
          <button id="btn-start" class="iv-btn-start" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3z"/></svg>
            开始面试
          </button>
          <button id="btn-end" class="iv-btn-end hidden" type="button">结束面试并总结</button>
          <div id="iv-config-status" class="iv-config-status"></div>
        </div>
        <div class="iv-tip-card">
          <div class="iv-tip-title">💡 小提示</div>
          <p>面试官会根据你的简历项目层层追问。认真作答，AI 会给出点评并继续提问。先在「大模型设置」里配置好模型。</p>
        </div>
      </aside>

      <!-- 右：面试对话 -->
      <section class="aic-chat iv-chat">
        <div id="chat-scroll" class="aic-chat-scroll">
          <div id="chat-list" class="aic-chat-list"></div>
        </div>
        <div class="aic-inputbar">
          <textarea id="chat-input" class="aic-input" rows="3" placeholder="输入你的回答…（Ctrl+Enter 发送）" disabled></textarea>
          <div class="aic-input-actions">
            <span id="turn-counter" class="iv-turn"></span>
            <button id="btn-send" class="aic-btn-generate" type="button" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
              发送回答
            </button>
          </div>
        </div>
      </section>
    </div>

    <script src="static/js/hud.js?v=5"></script>
    <script src="static/js/settings.js?v=5"></script>
    <script src="static/js/interview.js?v=5"></script>
  </body>
</html>
