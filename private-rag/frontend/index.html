<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG · 本地知识库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- ===== 背景层 ===== -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="logo-wrap" title="RAG 本地知识库">
      <!-- 抽象科技图标:6 边形 + 中心脉冲圆 -->
      <svg class="logo" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#7dd3fc"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <polygon points="24,2 44,13 44,35 24,46 4,35 4,13"
                 stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.9"/>
        <polygon points="24,10 37,17 37,31 24,38 11,31 11,17"
                 stroke="url(#g1)" stroke-width="1" fill="none" opacity="0.45"/>
        <circle cx="24" cy="24" r="3" fill="url(#g1)">
          <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="24" cy="24" r="8" stroke="url(#g1)" stroke-width="0.8" fill="none" opacity="0.4">
          <animate attributeName="r" values="8;14;8" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </svg>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-tab="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 12a8 8 0 0 1-12.2 6.8L3 20l1.2-5.8A8 8 0 1 1 21 12Z"/>
        </svg>
        <span>智能问答</span>
      </button>
      <button class="nav-item" data-tab="kb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4Z"/>
          <path d="M4 4v12a4 4 0 0 0 4 4"/>
          <path d="M9 9h6M9 13h4"/>
        </svg>
        <span>本地知识库</span>
      </button>
      <button class="nav-item" data-tab="cites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5"/>
          <path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5"/>
        </svg>
        <span>引用来源</span>
      </button>
      <button class="nav-item" data-tab="conv">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 12h8M8 8h8M8 16h5"/>
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
        <span>多轮对话</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="health" id="health">
        <span class="dot"></span><span>检测中...</span>
      </div>
      <div class="model-info">
        <div class="mi-label">Embedding</div>
        <div class="mi-val">Qwen3-4B</div>
        <div class="mi-label" style="margin-top:8px">LLM</div>
        <div class="mi-val">MiniMax-M3</div>
      </div>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <main>
    <!-- Tab 1: 智能问答 -->
    <section class="panel active" id="panel-chat">
      <div class="panel-head">
        <h1>智能问答</h1>
        <p>系统自动判断是否需要调用知识库</p>
      </div>
      <div class="chat-wrap">
        <div class="chat-list" id="chatList">
          <div class="empty">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                <line x1="9" y1="9" x2="9.01" y2="9"/>
                <line x1="15" y1="9" x2="15.01" y2="9"/>
              </svg>
            </div>
            <div class="empty-title">有什么想问的?</div>
            <div class="empty-suggest">
              <button class="chip">点头教育的价值观是什么?</button>
              <button class="chip">公司的核心产品有哪些?</button>
              <button class="chip">你好</button>
            </div>
          </div>
        </div>
        <div class="composer">
          <div class="composer-inner">
            <textarea id="chatInput" placeholder="发消息给 AI · Enter 发送 · Shift+Enter 换行" rows="1"></textarea>
            <button id="chatSend" class="send-btn" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 2: 本地知识库 -->
    <section class="panel" id="panel-kb">
      <div class="panel-head">
        <h1>本地知识库</h1>
        <p>支持 PDF / DOCX / TXT / Markdown · 解析后可预览分块</p>
      </div>
      <div class="kb-grid">
        <div class="kb-col">
          <div class="card stat-card">
            <div class="stat">
              <div class="stat-num" id="statDocs">—</div>
              <div class="stat-lbl">文档</div>
            </div>
            <div class="stat">
              <div class="stat-num" id="statChunks">—</div>
              <div class="stat-lbl">分块</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">上传文档</div>
            <label class="file-drop" id="fileDrop">
              <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.markdown" hidden />
              <div class="file-drop-inner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <div class="file-drop-text">点击选择 或 拖入文件</div>
                <div class="file-drop-name" id="fileName"></div>
              </div>
            </label>
            <div class="row">
              <button class="btn ghost" id="btnPreview">预览分块</button>
              <button class="btn primary" id="btnIngest">加入知识库</button>
            </div>
            <div class="msg-line" id="ingestMsg"></div>
          </div>

          <div class="card">
            <div class="card-title">已入库文档</div>
            <ul class="doc-list" id="docList"></ul>
          </div>
        </div>

        <div class="kb-col">
          <div class="card chunk-card">
            <div class="card-title">分块预览</div>
            <div id="chunkPreview" class="chunk-preview">
              <div class="placeholder">选择文件后点击「预览分块」或「加入知识库」</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 3: 引用来源 -->
    <section class="panel" id="panel-cites">
      <div class="panel-head">
        <h1>引用来源</h1>
        <p>智能问答中点击「查看引用」即可在此查看具体段落</p>
      </div>
      <div class="card">
        <div id="citePanel" class="placeholder">还没有引用记录</div>
      </div>
    </section>

    <!-- Tab 4: 多轮对话 -->
    <section class="panel" id="panel-conv">
      <div class="panel-head">
        <h1>多轮对话</h1>
        <p>保留上下文 · 结合历史问题检索</p>
        <button class="btn ghost btn-sm" id="convClear">清空对话</button>
      </div>
      <div class="chat-wrap">
        <div class="chat-list" id="convList">
          <div class="empty">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div class="empty-title">开始一段连续对话</div>
            <div class="empty-suggest">
              <button class="chip">点头教育有哪些核心产品?</button>
              <button class="chip">那人工智能项目具体包含什么?</button>
              <button class="chip">大模型系统课面向谁?</button>
            </div>
          </div>
        </div>
        <div class="composer">
          <div class="composer-inner">
            <textarea id="convInput" placeholder="继续提问..." rows="1"></textarea>
            <button id="convSend" class="send-btn" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
