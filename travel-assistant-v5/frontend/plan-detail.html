<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c8423c" />
  <title>行程详情 · AI 智行助手</title>
  <link rel="stylesheet" href="/static/assets/css/main.css" />
  <link rel="stylesheet" href="/static/assets/css/plan-detail.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
<body data-theme="auto">

  <!-- ================== 顶部导航 ================== -->
  <nav class="topnav no-print" aria-label="主导航">
    <a class="topnav__brand" href="/">
      <span class="topnav__logo">智</span>
      <span>AI 智行助手</span>
    </a>
    <div class="topnav__links">
      <a class="topnav__link" href="/chat"><span class="topnav__link--label">对话</span></a>
      <a class="topnav__link is-active" href="/plan"><span class="topnav__link--label">行程</span></a>
    </div>
    <div class="topnav__tools">
      <button class="theme-toggle" type="button" id="themeToggle" aria-label="切换主题">
        <!-- Sun -->
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <!-- Moon -->
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ================== 加载占位 ================== -->
  <section class="stage stage--loading" id="loadingStage" aria-live="polite">
    <div class="loader" role="status">
      <span class="loader__pin"></span>
      <p class="loader__text">正在翻开你的行程手册…</p>
    </div>
  </section>

  <!-- ================== 错误占位 ================== -->
  <section class="stage stage--error" id="errorStage" hidden>
    <div class="error-card">
      <div class="error-card__icon">!</div>
      <h2 class="error-card__title">未找到这份行程</h2>
      <p class="muted" id="errorMsg">请检查链接是否正确。</p>
      <div class="error-card__actions">
        <a class="btn btn--accent" href="/plan">返回行程列表</a>
      </div>
    </div>
  </section>

  <!-- ================== 主内容（懒加载后渲染） ================== -->
  <main id="detailRoot" hidden>

    <!-- =========== 1. 分镜头：Hero =========== -->
    <header class="hero">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__skyline"></div>
        <div class="hero__sun"></div>
      </div>

      <div class="container hero__inner">
        <a href="/plan" class="hero__back no-print">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>返回行程列表</span>
        </a>

        <div class="hero__meta">
          <span class="hero__chip" id="heroDate">— · —</span>
          <span class="hero__chip hero__chip--gold" id="heroId">plan_xxx</span>
        </div>

        <h1 class="hero__title" id="heroTitle">行程标题</h1>
        <p class="hero__sub" id="heroSub">正在加载行程摘要…</p>

        <div class="hero__stamps" id="heroStamps" aria-hidden="true">
          <span class="hero__stamp">·</span>
          <span class="hero__stamp">·</span>
          <span class="hero__stamp">·</span>
        </div>
      </div>
    </header>

    <!-- =========== 2. 操作工具栏 =========== -->
    <div class="actions-bar no-print">
      <div class="container actions-bar__inner">
        <div class="actions-bar__hint">
          <span class="actions-bar__dot"></span>
          <span id="fileMeta">— KB</span>
        </div>
        <div class="actions-bar__btns">
          <button class="btn" id="copyBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>复制 Markdown</span>
          </button>
          <button class="btn btn--accent" id="printBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            <span>打印 / 导出 PDF</span>
          </button>
        </div>
      </div>
    </div>

    <!-- =========== 3. 行程摘要卡片（基本信息） =========== -->
    <section class="summary reveal" id="summarySection">
      <div class="container">
        <div class="summary__head">
          <span class="summary__kicker">Trip Brief</span>
          <h2 class="summary__title">出行基本信息</h2>
          <div class="summary__rule"></div>
        </div>

        <div class="summary__grid" id="summaryGrid">
          <!-- 由 JS 渲染 -->
        </div>
      </div>
    </section>

    <!-- =========== 4. 主体：Markdown 内容 =========== -->
    <article class="prose reading reveal" id="proseRoot">
      <!-- 由 marked.js 渲染 -->
    </article>

    <!-- =========== 5. 页脚 =========== -->
    <footer class="detail-footer reveal">
      <div class="container">
        <div class="detail-footer__rule"></div>
        <p class="detail-footer__line">— 行程结束，期待下一次出发 —</p>
        <p class="detail-footer__sub">由 AI 智行助手 · 自动规划</p>
        <a href="/plan" class="btn btn--ghost no-print" style="margin-top: 24px;">
          ← 回到行程列表
        </a>
      </div>
    </footer>
  </main>

  <!-- ================== 浮动操作（回到顶部） ================== -->
  <button class="to-top no-print" id="toTop" type="button" aria-label="回到顶部" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <!-- ================== Toast ================== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/assets/js/pages/plan-detail.js" defer></script>
</body>
</html>
